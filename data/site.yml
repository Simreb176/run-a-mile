# Site-wide settings.
# Anything your dad wants to change site-wide lives here (title, description,
# contact details, social links, and the SEO block used for search engines).

title: Run A Mile
description: One man's return to running — the story, the training log, and the mile.

# The line at the bottom of every page, after "Made in <location> ·".
footer_note: one run/walk at a time.

# The public URL once the custom domain is attached (runamile.co.uk).
# Used for SEO tags and sharing cards.
url: https://runamile.co.uk

author:
  name: Simon Rebecchi
  # Short line shown under the site title.
  tagline: Documenting my return to running, one run/walk at a time.
  location: Baildon, UK
  email: si@runamile.co.uk

# Social links. Leave a value empty and it simply won't be linked.
social:
  instagram: https://www.instagram.com/run.a.mile
  facebook: https://www.facebook.com/profile.php?id=61595342308648
  strava: https://www.strava.com/athletes/7177270

# The words at the top of the blog and log pages.
# The line under each title can hold a link, written like [the training log](log.html).
blog:
  eyebrow: The full story
  heading: The blog
  intro: "Every post I've written, newest first. The day-to-day miles live in the [training log](log.html)."
log:
  eyebrow: Miles in the bank
  heading: Training log
  intro: "Every run I've logged, newest first. The thinking behind them is in the [blog](blog.html)."

# Search engine / sharing description. Update this when the story changes.
seo:
  description: "A blog and training log documenting a return to running — from the first hesitant run to the first mile."
