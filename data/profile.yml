# About the runner and the goal.
# This is the "hello world" content — real text will replace it soon.

name: To “Run a Mile” - to avoid something
tagline: "Can you return to running with Hip OsteoArthritis?"
location: Bradford area, UK

# The small line above your name on the home page.
eyebrow: A running journey

# Shown on the home page hero and the about page.
intro: |2
    When you mention running to some, they would literally “run a mile” not to
    run.

    This website is dedicated to my attempt to return to running, but only to
    “run a mile” literally.

    For most of my life, I’ve been reasonably active, jogging, tennis, cricket,
    sailing, swimming & cycling. I am no athlete but I want to get back to be
    able to "run a mile" again.

    A couple of years ago I stated to slow down running. I was never that quick
    to start with, with around a 30 minute 5k but I saw this sliding quite
    quickly to around 38 minutes and just thought “getting older”.

    Had a couple of injuries and rather than a week to return, it took longer,
    sometimes a month for me to get back to running.

    Then on return from a winter break in March 2025, I couldn’t get up and had
    a searing pain and my hip had locked. Over a 19 day period this progressed
    in pain so I saw my GP, had an x-ray and saw a Physio to get me back to
    running after a diagnosis of moderate osteoarthritis. 3 months later I
    started back on a special running scheme and went to the gym 3 times a week,
    yoga and Pilates and ran a parkrun in 44 mins 2 more months later.

    From here I then blew a knee bursa on the same leg and had some more time
    away from general exercise with a new physio approach and this cycle
    continued until I was told I needed a new hip and told to stop running.

    I decided I didn’t need a hip replacement yet as the pain had subsided as I
    had got stronger in the gym.

    Weight was another problem, putting on 1 1/2 stone during this time. Always
    on the slightly well built side, this extra weight needs to be shifted to
    return to running to put less stress on the joints.

    I will develop a section on how I will lose the weight whilst protecting or
    improving muscle density.

    So come on a journey with me, with early morning starts, heavy legs and the
    small wins — documented one honest walk or run at a time. Welcome to running
    a mile, in the sense nobody probably ever intended.

    Run a mi1e

