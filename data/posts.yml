# Blog posts, newest first.
#
# Each post has:
#   date      - ISO date (YYYY-MM-DD), used for ordering and the URL
#   title     - the post heading
#   slug      - the URL path, e.g. posts/hello-world/ -> /posts/hello-world/
#   body      - the post text. Blank lines separate paragraphs.
#               Markdown is supported if the `markdown` package is installed
#               (see requirements.txt) — **bold**, *italic*, [links](...), etc.
#               Without it, paragraphs are still rendered, just without styling.

