- date: 2026-10-12
  title: Hello, World (Again)
  slug: hello-world
  body: |
    This is the first post on my new site. After too long away from the road,
    I've decided it's time to run again — and to write about it while I do.

    Lorem ipsum dolor sit amet, consectetur adipiscing elit. The plan is simple:
    start slow, stay consistent, and try not to injure myself in week two.
    Every run gets logged here, and every lesson learned gets written down.

    If you're somewhere on your own comeback journey, I hope this helps. See you
    at the next mile marker.

- date: 2026-10-05
  title: The First Week Back
  slug: the-first-week-back
  body: |
    Week one is in the books. Three runs, twenty minutes each, and a pair of
    calves that have Opinions about it all.

    The biggest surprise was how much of the battle is mental. Sed do eiusmod
    tempor incididunt ut labore et dolore magna aliqua. The body catches up
    faster than the head does, and the head needs the reminder most.
