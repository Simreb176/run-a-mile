<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Edit runamile.co.uk</title>
<style>
:root{--bg:#fdf9f4;--surface:#fff;--line:#ece2d4;--ink:#211c17;--muted:#6f6659;
  --accent:#d9480f;--radius:14px;--radius-sm:9px;
  --font-sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-serif:ui-serif,Georgia,Cambria,serif}
@media (prefers-color-scheme: dark){:root{--bg:#14110e;--surface:#1f1b16;--line:#2f2a23;
  --ink:#f4efe8;--muted:#b3a695;--accent:#f97e4a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
  font-family:var(--font-sans);padding:24px}
form{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:26px}
h1{margin:0 0 4px;font-size:1.2rem;font-family:var(--font-serif)}
p{margin:0 0 18px;color:var(--muted);font-size:.9rem}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:6px}
input{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);
  background:var(--bg);color:var(--ink)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{width:100%;margin-top:14px;font:inherit;font-weight:600;padding:11px 16px;border:0;
  border-radius:999px;background:var(--accent);color:#fff;cursor:pointer}
.msg{margin:0 0 16px;font-size:.9rem;color:#a4262c}
</style>
</head>
<body>
<form method="post">
  <h1>Editing runamile.co.uk</h1>
  <p>Enter the password to carry on. It's in the file <code>.editor-pass</code> on your computer.</p>
  {% for _, message in messages %}<p class="msg">{{ message }}</p>{% endfor %}
  <label for="password">Password</label>
  <input type="password" id="password" name="password" autofocus autocomplete="current-password">
  <button type="submit">Unlock</button>
</form>
</body>
</html>
